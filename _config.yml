title: SOMaR Data Format
description: First draft of the community standard data format conventions for Sensing the Ocean with Marine Radar 
theme: just-the-docs

# Version of the specification: SOMaR-<somar_version> in the Conventions
# attribute of the examples, with the suffix -draft while somar_status is
# "draft" (see the Versioning section of index.md).
somar_version: "0.5"
somar_status: "draft"

url: https://sensing-the-ocean-with-marine-radar.github.io
baseurl: /somar-format-draft

plugins:
  - jekyll-default-layout
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true
  
aux_links:
  "GitHub Repository": https://github.com/sensing-the-ocean-with-marine-radar/somar-format-draft

# Makes Aux links open in a new tab. Default is false
aux_links_new_tab: true

# Enable or disable the side/mobile menu globally
# Nav menu can also be selectively enabled or disabled using page variables or the minimal layout
nav_enabled: true

# Site search: also split on ":", "(", ")" and "," so that attribute and
# variable names inside the CDL examples (e.g. measurement_quality:valid_range,
# x(x)) are indexed as separate words.
search:
  tokenizer_separator: /[\s\-/:(),]+/

# Heading anchor links appear on hover over h1-h6 tags in page content
# allowing users to deep link to a particular heading on a page.
#
# Supports true (default) or false
heading_anchors: true

# Footer: date of the last commit that changed a page (see _plugins/last_modified.rb)
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d"

# The just-the-docs theme (0.12.0, the latest release) still uses Sass features
# that Dart Sass has deprecated. Silence those warnings, which come from the
# theme's stylesheets rather than from this repository.
sass:
  quiet_deps: true
  silence_deprecations:
    - import

# Placeholder pages for levels the format does not define yet.
exclude:
  - scripts/
  - contents/product_types/level1/level1c.md

# Callouts marking topics the community has yet to decide.
callouts:
  open_issue:
    title: Open issue
    color: yellow
  informative:
    title: Informative
    color: blue
