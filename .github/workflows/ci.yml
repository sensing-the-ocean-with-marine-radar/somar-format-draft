name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the page modification dates
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 1 # Increment this number if you need to re-download cached gems
      - name: Build with Jekyll
        run: bundle exec jekyll build
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install BeautifulSoup, pypdf, and Playwright
        run: |
          pip install beautifulsoup4 pypdf playwright
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core  # Noto Sans for the page footer
      - name: Build PDF
        run: python3 scripts/build_pdf.py _site
      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: somar-format-pdf
          path: _site/somar-format.pdf

  # Build and check the CDL examples of the specification
  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install ncgen, ncdump, and cf-units
        run: |
          sudo apt-get update
          sudo apt-get install -y netcdf-bin
          pip install cf-units
      - name: Check examples
        run: python3 scripts/check_examples.py --strict
